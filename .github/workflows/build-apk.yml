name: Build and Release JunbaCopilot v4 APK

on:
  workflow_dispatch: 
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Inject GitHub Secrets to config.json
        run: |
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo '{"GEMINI_API_KEY": "${{ secrets.GEMINI_API_KEY }}"}' > config.json
          else
            echo '{}' > config.json
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev lld

      - name: Setup Android SDK cmdline-tools and accept licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip cmdline-tools.zip -d ~/.buildozer/android/platform/android-sdk/cmdline-tools
          mv ~/.buildozer/android/platform/android-sdk/cmdline-tools/cmdline-tools ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install "Cython<3.0" buildozer

      - name: Run Buildozer
        run: |
          buildozer android debug

      - name: Prepare APK
        id: prepare_apk
        run: |
          APK_PATH=$(find bin/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found!"
            exit 1
          fi
          cp "$APK_PATH" bin/JunbaCopilot-v4.apk
          echo "apk_file=bin/JunbaCopilot-v4.apk" >> $GITHUB_OUTPUT
          
          RELEASE_TAG="v$(date +'%Y.%m.%d-%H%M')"
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_apk.outputs.release_tag }}
          name: 峻爸副駕 v4 (${{ steps.prepare_apk.outputs.release_tag }})
          body: |
            ### 🚗 峻爸副駕 v4 最新安裝檔
            * **核心功能**：
              - 寬鬆喚醒詞過濾
              - A/B/C 三種方案切換
              - 閒聊模式與路況巡檢
          files: ${{ steps.prepare_apk.outputs.apk_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
