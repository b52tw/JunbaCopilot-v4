name: Build and Release JunbaCopilot v4 APK

on:
  workflow_dispatch: 
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 簽出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 注入 GitHub Secrets 至 config.json (若有設定)
        run: |
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo '{"GEMINI_API_KEY": "${{ secrets.GEMINI_API_KEY }}"}' > config.json
          else
            echo '{}' > config.json
          fi

      - name: 安裝系統編譯依賴庫
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev lld

      - name: 自動同意 Android SDK 授權合約
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 安裝 Buildozer 並強制鎖定 Cython < 3.0 (防編譯崩潰)
        run: |
          pip install --upgrade pip
          pip install "Cython<3.0" buildozer

      - name: 執行 Buildozer 雲端編譯
        run: |
          buildozer android debug

      - name: 整理 APK 檔名以利直接安裝
        id: prepare_apk
        run: |
          APK_PATH=$(find bin/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "錯誤：未找到編譯出的 APK 檔案！"
            exit 1
          fi
          cp "$APK_PATH" bin/JunbaCopilot-v4.apk
          echo "apk_file=bin/JunbaCopilot-v4.apk" >> $GITHUB_OUTPUT
          
          RELEASE_TAG="v$(date +'%Y.%m.%d-%H%M')"
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT

      - name: 自動發佈至 GitHub Release (提供手機直接下載 .apk)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_apk.outputs.release_tag }}
          name: 峻爸副駕 v4 (${{ steps.prepare_apk.outputs.release_tag }})
          body: |
            ### 🚗 峻爸副駕 v4 最新安裝檔
            * **核心功能**：
              - 寬鬆喚醒詞過濾（支援「副駕副駕」等諧音）
              - 支援語音直接切換 A/B/C 三種方案
              - 內建閒聊模式 (無字數限制)
              - 5分鐘氣象與路況巡檢
            * **手機安裝說明**：
              - 點擊下方 `JunbaCopilot-v4.apk` 直接下載並安裝。
          files: ${{ steps.prepare_apk.outputs.apk_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
