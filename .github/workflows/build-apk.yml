name: Build and Release JunbaCopilot v4 APK

on:
  workflow_dispatch: 
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Inject GitHub Secrets to config.json
        run: |
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo '{"GEMINI_API_KEY": "${{ secrets.GEMINI_API_KEY }}"}' > config.json
          else
            echo '{}' > config.json
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev lld

      - name: Setup Android SDK cmdline-tools and accept licenses
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$SDK_DIR/cmdline-tools"
          mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
          
          mkdir -p "$SDK_DIR/tools/bin"
          ln -sf "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "$SDK_DIR/tools/bin/sdkmanager"
          ln -sf "$SDK_DIR/cmdline-tools/latest/bin/avdmanager" "$SDK_DIR/tools/bin/avdmanager"
          
          mkdir -p "$SDK_DIR/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK_DIR/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" >> "$SDK_DIR/licenses/android-sdk-license"
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_DIR" --licenses || true
          "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install "Cython<3.0" buildozer

      - name: Run Buildozer
        run: |
          yes | buildozer android debug

      - name: Prepare APK
        id: prepare_apk
        run: |
          APK_PATH=$(find bin/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found!"
            exit 1
          fi
          cp "$APK_PATH" bin/JunbaCopilot-v4.apk
          echo "apk_file=bin/JunbaCopilot-v4.apk" >> $GITHUB_OUTPUT
          
          RELEASE_TAG="v$(date +'%Y.%m.%d-%H%M%S')"
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT

      - name: Upload APK to Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JunbaCopilot-v4-APK
          path: bin/JunbaCopilot-v4.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_apk.outputs.release_tag }}
          name: 峻爸副駕 v4 (${{ steps.prepare_apk.outputs.release_tag }})
          body: |
            ### 🚗 峻爸副駕 v4 最新安裝檔 (中文字型與語音修復版)
            * **修復內容**：
              - 掛載 Android 系統內建繁體中文字型，消除方框亂碼
              - 綁定語音辨識結果回傳監聽器
              - 新增手動文字輸入備用框與模式快速切換鈕
          files: ${{ steps.prepare_apk.outputs.apk_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
